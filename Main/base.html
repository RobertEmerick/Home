<!------------------------- CSS Formatting --------------------------------->
<style>
    :root{                                                /* Global Colour Vars */
        --white: #ffffff;
        --Light-Grey: #3a3a3a;
        --Grey: #1a1a1a;
        --Primay: #491585;
        --Light-Primary: #8821ff;
        --Accent: #959713;
        --Light-Accent: #e9ff21;
    }
    
    body{
        background-color: var(--Grey);                   /* Sets Background  */
        color: var(--white);                             /* Sets text Colour  */
        font-family:  sans-serif, Verdana, arial; 
        font-size: clamp(1rem, 0.8rem + 1.5vw, 1.3rem); /* min size, scale factor, max size*/
        margin: 0;                                      /* remove defualt margins */
        padding: 0;

    }

    .base{                                        /* basic centererd format */
        display: flex;
        flex-direction: column; align-items: center;  /*Horizontally*/
        justify-content: center; min-height: 100vh;   /*Vertically*/
    }

    .header{                                        /* header formating */
        position: sticky;
        top: 0;
        padding: 10px 16px;
        background: var(--Primay);
        color: #f1f1f1;

    }
    .header-home{                                   /* home button formating */

    }

    .header-search{                                      /* search bar formating */

    }


</style>
